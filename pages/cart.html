<!DOCTYPE html>
<html lang="en" data-title-en="Cart" data-title-ar="السلة">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    /* Set lang/dir BEFORE first paint — prevents English flashing under Arabic */
    (function() {
      try {
        var lang = localStorage.getItem("vida_lang") || "en";
        document.documentElement.lang = lang;
        document.documentElement.dir  = lang === "ar" ? "rtl" : "ltr";
      } catch (e) {}
    })();
  </script>
  <title>Cart — VIDA Office Furniture</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="icon" href="../favicon.ico" sizes="any">
</head>
<body data-page="cart">

  <section style="background: var(--vida-bone); padding: 56px 0 32px;">
    <div class="container">
      <nav class="breadcrumb">
        <a href="../index.html"><span data-lang-en>Home</span><span data-lang-ar>الرئيسية</span></a>
        <span>/</span>
        <span data-lang-en>Cart</span><span data-lang-ar>السلة</span>
      </nav>
      <h1><span data-lang-en>Shopping Cart</span><span data-lang-ar>سلة التسوق</span></h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="cartRoot"></div>
    </div>
  </section>

  <script src="../js/products.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function render() {
      const cart = getCart();
      const root = document.getElementById("cartRoot");

      if (cart.length === 0) {
        root.innerHTML = `
          <div class="cart-empty">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            <h2><span data-lang-en>Your cart is empty</span><span data-lang-ar>السلة فارغة</span></h2>
            <p class="muted"><span data-lang-en>Browse our collections and add pieces you love.</span><span data-lang-ar>تصفّح مجموعاتنا وأضف القطع التي تعجبك.</span></p>
            <a href="products.html" class="btn btn--primary"><span data-lang-en>Start Shopping</span><span data-lang-ar>ابدأ التسوّق</span></a>
          </div>
        `;
        setLang(getLang());
        return;
      }

      const itemsHTML = cart.map(item => {
        const p = PRODUCTS.find(x => x.id === item.id);
        if (!p) return "";
        return `
          <div class="cart-item" data-id="${p.id}">
            <div class="cart-item__img"><img src="../${p.image}" alt=""></div>
            <div>
              <div class="cart-item__name">${pickLang(p.name)}</div>
              <div class="cart-item__meta">${p.id} · ${pickLang(p.series)}</div>
              <div class="cart-item__price">${fmtPrice(p.price)}</div>
              <button class="cart-item__remove" data-act="remove" data-id="${p.id}">
                ${getLang()==="ar"?"إزالة":"Remove"}
              </button>
            </div>
            <div class="pd__qty" style="height: fit-content;">
              <button data-act="dec" data-id="${p.id}">−</button>
              <input type="number" value="${item.qty}" min="1" data-act="set" data-id="${p.id}">
              <button data-act="inc" data-id="${p.id}">+</button>
            </div>
          </div>
        `;
      }).join("");

      const t = cartTotals();
      const lang = getLang();

      root.innerHTML = `
        <div class="cart-layout">
          <div>
            ${itemsHTML}
            <div style="margin-top: 24px;">
              <a href="products.html" class="btn btn--ghost">
                ${lang==="ar"?"← متابعة التسوّق":"← Continue shopping"}
              </a>
            </div>
          </div>
          <aside class="cart-summary">
            <h3>${lang==="ar"?"ملخص الطلب":"Order Summary"}</h3>
            <div class="cart-summary__row">
              <span>${lang==="ar"?"المجموع الفرعي":"Subtotal"}</span>
              <strong>${fmtPrice(t.subtotal)}</strong>
            </div>
            <div class="cart-summary__row">
              <span>${lang==="ar"?"التوصيل":"Shipping"}</span>
              <strong>${t.shipping === 0 ? (lang==="ar"?"مجاني":"Free") : fmtPrice(t.shipping)}</strong>
            </div>
            <div class="cart-summary__row">
              <span>${lang==="ar"?"ضريبة القيمة المضافة (15%)":"VAT (15%)"}</span>
              <strong>${fmtPrice(t.vat)}</strong>
            </div>
            <div class="cart-summary__row cart-summary__row--total">
              <span>${lang==="ar"?"الإجمالي":"Total"}</span>
              <strong>${fmtPrice(t.total)}</strong>
            </div>
            <a href="checkout.html" class="btn btn--primary">
              ${lang==="ar"?"إتمام الطلب →":"Proceed to Checkout →"}
            </a>
            <a href="https://wa.me/${VIDA.whatsapp}?text=${encodeURIComponent(lang==="ar"?"مرحباً، أريد طلب المنتجات في سلتي":"Hi, I'd like to order the items in my cart")}" class="btn btn--gold" target="_blank">
              ${lang==="ar"?"اطلب عن طريق واتساب":"Order via WhatsApp"}
            </a>
            <p class="muted" style="margin-top: 16px; font-size: .8rem; text-align: center;">
              ${lang==="ar"?"التوصيل مجاني للطلبات أكثر من 5,000 ر.س":"Free delivery on orders over SAR 5,000"}
            </p>
          </aside>
        </div>
      `;

      // Wire events
      root.querySelectorAll("[data-act]").forEach(el => {
        const id = el.getAttribute("data-id");
        const act = el.getAttribute("data-act");
        if (act === "remove")  el.addEventListener("click", () => { removeFromCart(id); render(); });
        if (act === "inc")     el.addEventListener("click", () => { const c = getCart().find(i=>i.id===id); updateCartItem(id, c.qty+1); render(); });
        if (act === "dec")     el.addEventListener("click", () => { const c = getCart().find(i=>i.id===id); updateCartItem(id, c.qty-1); render(); });
        if (act === "set")     el.addEventListener("change", () => { updateCartItem(id, Math.max(1, parseInt(el.value || 1))); render(); });
      });

      setLang(getLang());
    }

    window.onLangChange = render;
    document.addEventListener("DOMContentLoaded", () => setTimeout(render, 0));
  </script>
  <script src="../js/huda.js"></script>
</body>
</html>
